name: pen/setup-os-tape
description: Sets up the Pen toolchain, LLVM, and PEN_ROOT for os-tape
runs:
  using: composite
  steps:
    - run: |
        set -e
        PINNED="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        [ -n "$PINNED" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
        # Fully sync every toolchain serially, before any cargo runs: one
        # cargo build fans out to parallel rustc shims, and concurrent
        # rustup syncs race on the shared downloads dir (observed .partial
        # rename failures). `update` (not `install`) so pre-existing stale
        # toolchains are synced too. stable covers cargo runs outside this
        # checkout (pen stages file:// dependencies elsewhere).
        rustup update --no-self-update stable "$PINNED"
        rustup component add --toolchain "$PINNED" clippy
      shell: bash
    - uses: raviqqe/enable-homebrew@6bd383659a321c332bd0c0ed445c32d54e04efe8 # v1.0.5
    - run: brew install llvm@16
      shell: bash
    - run: echo "PATH=$(brew --prefix)/opt/llvm@16/bin:$PATH" >>$GITHUB_ENV
      shell: bash
    - run: cargo install turtle-build
      shell: bash
    - run: |
        set -e
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) asset="pen-$PEN_VERSION-x86_64-unknown-linux-gnu.tar.xz" ;;
          macOS-ARM64) asset="pen-$PEN_VERSION-aarch64-apple-darwin.tar.xz" ;;
          *) echo "unsupported platform" >&2; exit 1 ;;
        esac
        curl -sL --fail -o /tmp/pen.tar.xz \
          "https://github.com/pen-lang/pen/releases/download/v$PEN_VERSION/$asset"
        mkdir -p /tmp/pen-dist "$HOME/.local/bin"
        tar -xf /tmp/pen.tar.xz -C /tmp/pen-dist target/release/pen
        cp /tmp/pen-dist/target/release/pen "$HOME/.local/bin/pen"
        echo "$HOME/.local/bin" >>$GITHUB_PATH
      shell: bash
    - run: git clone --depth 1 --branch "v$PEN_VERSION" https://github.com/pen-lang/pen /tmp/pen-root
      shell: bash
    - run: echo "PEN_ROOT=/tmp/pen-root" >>$GITHUB_ENV
      shell: bash
    - run: |
        set -e
        # Every pen system package's ffi/ dir pins its own rust-toolchain.toml
        # with cross targets, and `pen build` runs those FFI builds
        # concurrently. Pre-install the whole union serially so no toolchain
        # sync - and no shared-downloads race - is left for build time.
        # Unavailable targets (renamed wasi shims) are skipped: a later sync
        # would skip them too.
        python3 - <<'EOF'
        import os
        import re
        import subprocess
        from pathlib import Path
        files = list(Path(".").glob("ffi/*/rust-toolchain.toml"))
        pkgs = Path(os.environ.get("PEN_ROOT", "/tmp/pen-root"), "packages")
        files += list(pkgs.glob("*/ffi/rust-toolchain.toml"))
        files += list(pkgs.glob("*/ffi/*/rust-toolchain.toml"))
        want = {}
        for path in files:
            text = path.read_text()
            channel = re.search(r'^channel\s*=\s*"([^"]+)"', text, re.M)
            if channel is None:
                continue
            targets = (
                re.findall(r'"([a-z0-9_]+-[a-z0-9_-]+)"', text.split("targets", 1)[1])
                if "targets" in text
                else []
            )
            want.setdefault(channel.group(1), set()).update(targets)
        for channel in sorted(want):
            subprocess.run(
                ["rustup", "toolchain", "install", "--profile", "minimal",
                 "--no-self-update", channel],
                check=True,
            )
            for target in sorted(want[channel]):
                done = subprocess.run(
                    ["rustup", "target", "add", "--toolchain", channel, target]
                )
                if done.returncode != 0:
                    print(f"setup-pen: skipping unavailable target {target}")
        EOF
      shell: bash
