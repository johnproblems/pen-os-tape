name: test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PEN_VERSION: 0.6.9
  RUSTUP_AUTO_SELF_UPDATE: disable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pen
      - run: pen build
      - run: cargo clippy --all-targets --manifest-path ffi/library/Cargo.toml -- -D warnings
      - run: cargo check --manifest-path ffi/application/Cargo.toml
      - run: RUSTFLAGS="-D warnings" cargo test -p os-tape-ffi
      - run: python3 -m unittest discover -s tests

  tapes:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pen
      - run: |
          rustup toolchain list
          rustup component list --toolchain stable --installed || true
          ls ~/.rustup/toolchains/ || true
          env | grep -i -E "rust|cargo" || true
        shell: bash
      - run: python3 tests/e2e.py
        env:
          # One cargo fans out to parallel rustc shims; if any rustup sync
          # is still needed at this point, concurrent shims race on the
          # shared downloads dir (.partial rename failures). Serial builds
          # are slower but cannot race.
          CARGO_BUILD_JOBS: "1"

  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/drift-check.sh

  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -k stdlib -v

  test:
    needs:
      - build
      - tapes
      - drift
      - portability
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
