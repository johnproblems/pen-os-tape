[package]
name = "os-tape-ffi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# The pen build scripts copy libos.a out of the target dir, so the artifact
# keeps its historical name even though the package is os-tape-ffi.
name = "os"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
ffi = { package = "pen-ffi", version = "0.10.26", features = ["runtime", "std"] }
fs2 = "0.4"
futures = "0.3.34"
serde_json = "1.0"
sha2 = "0.10"
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "net",
    "process",
    "rt",
    "sync",
    "time",
  ]
}
